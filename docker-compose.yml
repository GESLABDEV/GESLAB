# docker-compose.yml — GESLAB v5.2
# Ejecutar: docker-compose up -d
# Detener:  docker-compose down
# Reset DB: docker-compose down -v (CUIDADO: borra todos los datos)

version: '3.9'

services:

  # ===== BASE DE DATOS =====
  postgres:
    image: postgres:16-alpine
    container_name: geslab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: geslab_dev
      POSTGRES_USER: geslab_user
      POSTGRES_PASSWORD: geslab_secret_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U geslab_user -d geslab_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== CACHE / JOBS =====
  redis:
    image: redis:7-alpine
    container_name: geslab_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local